[project]
name = "icli"
version = "0.1.0"
description = "icli: non-interactive IDA Pro command-line interface"
authors = [
    { name = "Pierre-Alexandre Losson", email = "palosson@hex-rays.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ida-domain>=0.5.1",
    "ida-nexus>=0.13.4",
    "lief>=1.0.0",
    "ppdeep>=20260221",
    "py-tlsh>=5.0.0",
]

[project.scripts]
icli = "icli:main"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
release = [
    "python-semantic-release>=10.3.1",
    "taskipy>=1.14.1",
]

# Releases, as in ida-hcli: `uv run task <name>` (see .github/workflows/release.yml).
[tool.taskipy.tasks]
current-version = "semantic-release version --print-last-released"
dev-start = "semantic-release version --as-prerelease --patch --prerelease-token dev --no-changelog"
dev-patch = "semantic-release version --prerelease --prerelease-token dev --no-changelog"
release-minor = "semantic-release version --minor --no-changelog"
release-patch = "semantic-release version --patch --no-changelog"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/icli/__init__.py:__version__"]
# Binaries are built by the release workflow; only the lock file follows the version.
build_command = """
    uv lock --upgrade-package "$PACKAGE_NAME"
    git add uv.lock
"""
major_on_zero = false  # Stay in 0.x.x range
allow_zero_version = true

[tool.pyright]
# IDAPython modules are importable only inside IDA (engine code runs there).
extraPaths = ["/Applications/IDA Professional 9.5.app/Contents/MacOS/python"]
reportMissingModuleSource = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ida: needs a working IDA installation (spawns idalib workers)"]

[tool.ruff]
line-length = 110
