name: Release

run-name: ${{ github.event.inputs.release_type == 'dev' && 'Pre-Release Version Bump' || format('Release Version Bump ({0})', github.event.inputs.release_type) }}

# As in ida-hcli: bump the version with python-semantic-release, tag it, build
# the binaries from the tag and attach them to a GitHub Release.
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Select release type'
        required: true
        type: choice
        options:
          - dev
          - release-patch
          - release-minor
        default: 'dev'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_PYTHON: '3.12'
  # Same pin as ida-hcli: avoids the python-build-standalone 20260320
  # executable-stack regression.
  # See: https://github.com/astral-sh/python-build-standalone/issues/1061
  UV_VERSION: '0.10.6'

jobs:
  version:
    name: Bump version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      is_release: ${{ steps.version.outputs.is_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python with uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python and dependencies
        run: |
          uv python install "${{ env.UV_PYTHON }}"
          uv sync --group release

      # Never tag a commit whose unit tests fail.
      - name: Run unit tests
        run: uv run pytest tests/unit

      - name: Bump version
        id: version
        run: |
          CURRENT_VERSION=$(uv run task current-version | tail -1)
          case "$RELEASE_TYPE" in
            "dev")
              if [[ "$CURRENT_VERSION" == *dev* ]]; then
                uv run task dev-patch
              else
                uv run task dev-start
              fi
              echo "is_release=false" >> "$GITHUB_OUTPUT"
              ;;
            "release-minor")
              uv run task "$RELEASE_TYPE"
              echo "is_release=true" >> "$GITHUB_OUTPUT"
              ;;
            "release-patch")
              # Remove local dev tags to ensure patch increments from last stable release
              while IFS= read -r tag; do
                git tag -d "$tag" 2>/dev/null || true
              done < <(git tag -l "*dev*")
              uv run task release-patch
              echo "is_release=true" >> "$GITHUB_OUTPUT"
              ;;
          esac

          VERSION=$(uv run task current-version | tail -1)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Created version: ${VERSION}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TYPE: ${{ github.event.inputs.release_type }}

  binary:
    name: Binaries
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/binaries.yml
    with:
      ref: ${{ needs.version.outputs.tag }}
      version: ${{ needs.version.outputs.version }}
      retention-days: 1

  release:
    name: Create GitHub Release
    needs: [version, binary]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Create/Update GitHub Release with binaries
        run: |
          # Dev versions are pre-releases; only real releases become "latest".
          if [ "$IS_RELEASE" = "true" ]; then kind=--latest; else kind=--prerelease; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" $kind
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* $kind --title "$TAG"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          IS_RELEASE: ${{ needs.version.outputs.is_release }}
