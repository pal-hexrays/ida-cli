name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_PYTHON: '3.12'
  # Same pin as ida-hcli: avoids the python-build-standalone 20260320
  # executable-stack regression.
  # See: https://github.com/astral-sh/python-build-standalone/issues/1061
  UV_VERSION: '0.10.6'

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python with uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python and dependencies
        run: |
          uv python install "${{ env.UV_PYTHON }}"
          uv sync

      # The end-to-end tests (tests/e2e) need IDA, which runners do not have.
      - name: Run unit tests
        run: uv run pytest tests/unit

  binary:
    name: Build binary (${{ matrix.artifact-name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    artifact-name: icli-linux-x86_64 }
          - { os: ubuntu-24.04-arm, artifact-name: icli-linux-aarch64 }
          - { os: windows-latest,   artifact-name: icli-windows-x86_64 }
          - { os: windows-11-arm,   artifact-name: icli-windows-aarch64 }
          - { os: macos-latest,     artifact-name: icli-mac-arm64 }
          # As in ida-hcli: built on the arm64 runner under an x86_64 Python
          # (Rosetta 2), so PyInstaller produces a genuine x86_64 binary.
          - { os: macos-latest,     artifact-name: icli-mac-x86_64, emulated-arch: x86_64 }

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rosetta 2
        if: matrix.emulated-arch == 'x86_64'
        run: softwareupdate --install-rosetta --agree-to-license

      - name: Setup Python with uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Select emulated x86_64 Python
        if: matrix.emulated-arch == 'x86_64'
        shell: bash
        run: echo "UV_PYTHON=cpython-${UV_PYTHON}-macos-x86_64-none" >> "$GITHUB_ENV"

      - name: Install Python and dependencies
        run: |
          uv python install "${{ env.UV_PYTHON }}"
          uv sync

      - name: Set ARTIFACT_NAME
        shell: bash
        run: echo "ARTIFACT_NAME=${{ matrix.artifact-name }}" >> "$GITHUB_ENV"

      - name: Build binary
        run: uv run --with pyinstaller pyinstaller icli.spec

      # Runners have no IDA: check the commands that do not need it.
      - name: Smoke test
        shell: bash
        run: |
          set -euxo pipefail
          bin=$(ls dist/"$ARTIFACT_NAME"*)
          "$bin" --version
          "$bin" --help
          "$bin" help selectors
          "$bin" schema decompile
          "$bin" completion bash
          "$bin" ref decompile function

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: dist/${{ matrix.artifact-name }}*
          name: ${{ matrix.artifact-name }}
          retention-days: 14
          if-no-files-found: error
