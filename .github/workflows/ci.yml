name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_PYTHON: '3.12'
  # Same pin as ida-hcli: avoids the python-build-standalone 20260320
  # executable-stack regression.
  # See: https://github.com/astral-sh/python-build-standalone/issues/1061
  UV_VERSION: '0.10.6'

jobs:
  test:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python with uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python and dependencies
        run: |
          uv python install "${{ env.UV_PYTHON }}"
          uv sync

      # The end-to-end tests (tests/e2e) need IDA, which runners do not have.
      - name: Run unit tests
        run: uv run pytest tests/unit

  binary:
    name: Binaries
    uses: ./.github/workflows/binaries.yml
